spring:
  application:
    name: laboratorio

  datasource:
    url: jdbc:postgresql://localhost:5432/laboratorio
    username: postgres
    password: postgres

  flyway:
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}

  jpa:
    hibernate:
      # validate: Hibernate NO crea tablas; Flyway es quien las gestiona
      ddl-auto: validate
    open-in-view: false

# JWT propio (no Keycloak). El secret debe ser largo (>= 256 bits para HS256).
app:
  jwt:
    secret: "laboratorio-1-sebastian-herrera-clave-secreta-muy-larga-para-hs256-2026"
    expiration-ms: 86400000 # 24 horas
